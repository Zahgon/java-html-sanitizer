# Dependabot security updates are enabled for this repository.  The module
# uses only the Go standard library, so the gomod entry has nothing to bump
# today; it is here so that a dependency added later is watched.  The
# github-actions entry keeps the workflows' actions current.
#
# open-pull-requests-limit: 0 keeps version-update PRs off for the module;
# security updates still run.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
